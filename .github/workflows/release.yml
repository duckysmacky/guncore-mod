name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 3 on Gradle 4.9 only runs on JDK 8
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "build/libs/guncore-1.12.2-${GITHUB_REF_NAME#v}.jar"
          --draft --generate-notes --title "$GITHUB_REF_NAME"
